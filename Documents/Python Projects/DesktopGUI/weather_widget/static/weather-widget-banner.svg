<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F18" />
      <stop offset="0.55" stop-color="#15233A" />
      <stop offset="1" stop-color="#4F9EFF" />
      <animate attributeName="x1" values="0;150;0" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="1200;1050;1200" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 80) rotate(38) scale(310 200)">
      <stop stop-color="#4F9EFF" stop-opacity="0.34" />
      <stop offset="1" stop-color="#4F9EFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 250) rotate(180) scale(280 180)">
      <stop stop-color="#8EC5FF" stop-opacity="0.28" />
      <stop offset="1" stop-color="#8EC5FF" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02060D" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)" />
  <rect x="16" y="16" width="1168" height="288" rx="22" stroke="#F0F6FF" stroke-opacity="0.10" stroke-width="1"/>
  <ellipse cx="220" cy="82" rx="310" ry="200" fill="url(#glowLeft)" />
  <ellipse cx="1005" cy="250" rx="280" ry="180" fill="url(#glowRight)" />

  <g opacity="0.8" filter="url(#softBlur)">
    <circle cx="170" cy="92" r="34" fill="#4F9EFF">
      <animate attributeName="cy" values="92;78;92" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1030" cy="72" r="22" fill="#8EC5FF">
      <animate attributeName="cy" values="72;88;72" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="250" r="28" fill="#1A3A6E">
      <animate attributeName="cy" values="250;232;250" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <g opacity="0.45">
    <path d="M0 230C140 190 240 188 356 214C472 240 576 266 706 240C836 214 924 164 1200 194V320H0V230Z" fill="#0E1624">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="
          M0 230C140 190 240 188 356 214C472 240 576 266 706 240C836 214 924 164 1200 194V320H0V230Z;
          M0 220C158 184 254 214 370 226C486 238 596 224 716 204C836 184 984 176 1200 204V320H0V220Z;
          M0 230C140 190 240 188 356 214C472 240 576 266 706 240C836 214 924 164 1200 194V320H0V230Z" />
    </path>
  </g>

  <g filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite" />
    <rect x="705" y="56" width="360" height="210" rx="24" fill="#111827" />
    <rect x="705" y="56" width="360" height="210" rx="24" stroke="#2A4369" stroke-width="1.2" />
    <text x="738" y="98" fill="#4F9EFF" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">CURRENT WEATHER</text>
    <g transform="translate(770 145)">
      <circle cx="0" cy="0" r="24" fill="#F8C95C" />
      <g stroke="#F8C95C" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-40" x2="0" y2="-54" />
        <line x1="0" y1="40" x2="0" y2="54" />
        <line x1="-40" y1="0" x2="-54" y2="0" />
        <line x1="40" y1="0" x2="54" y2="0" />
        <line x1="-28" y1="-28" x2="-39" y2="-39" />
        <line x1="28" y1="-28" x2="39" y2="-39" />
        <line x1="-28" y1="28" x2="-39" y2="39" />
        <line x1="28" y1="28" x2="39" y2="39" />
      </g>
    </g>
    <text x="825" y="150" fill="#F0F6FF" font-size="54" font-family="Segoe UI, Arial, sans-serif" font-weight="700">26C</text>
    <text x="828" y="180" fill="#9FB8DA" font-size="18" font-family="Segoe UI, Arial, sans-serif">Partly Cloudy</text>

    <g>
      <rect x="738" y="204" width="88" height="34" rx="10" fill="#1A2234" />
      <rect x="840" y="204" width="88" height="34" rx="10" fill="#1A2234" />
      <rect x="942" y="204" width="88" height="34" rx="10" fill="#1A2234" />
      <text x="754" y="226" fill="#F0F6FF" font-size="14" font-family="Segoe UI, Arial, sans-serif">Feels 27C</text>
      <text x="862" y="226" fill="#F0F6FF" font-size="14" font-family="Segoe UI, Arial, sans-serif">Wind 12</text>
      <text x="958" y="226" fill="#F0F6FF" font-size="14" font-family="Segoe UI, Arial, sans-serif">Hum 68%</text>
    </g>
  </g>

  <g>
    <text x="86" y="108" fill="#8EC5FF" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="3">DESKTOP GUI</text>
    <text x="84" y="156" fill="#F0F6FF" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="800">Weather Widget</text>
    <text x="86" y="196" fill="#A8BEDB" font-size="24" font-family="Segoe UI, Arial, sans-serif">Floating forecast panel with live city search</text>
    <text x="86" y="232" fill="#A8BEDB" font-size="24" font-family="Segoe UI, Arial, sans-serif">Built with Python, Tkinter, and Open-Meteo</text>

    <g>
      <rect x="86" y="256" width="138" height="34" rx="17" fill="#4F9EFF" />
      <rect x="236" y="256" width="142" height="34" rx="17" fill="#1A2234" />
      <text x="120" y="278" fill="#07101B" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Live Forecast</text>
      <text x="271" y="278" fill="#DCE9F8" font-size="15" font-family="Segoe UI, Arial, sans-serif" font-weight="700">12h Outlook</text>
    </g>
  </g>

  <g opacity="0.7">
    <circle cx="622" cy="72" r="4" fill="#F0F6FF">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="590" cy="118" r="3" fill="#8EC5FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="262" r="5" fill="#4F9EFF">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.7s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
